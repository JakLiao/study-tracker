<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F6F8" />
  <title>作业小助手 · 小学生作业跟踪</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/vendor/flatpickr.min.css" />
  <link rel="stylesheet" href="/static/vendor/flatpickr-theme.css" />
</head>
<body>
  <!-- ====== SVG 图形库 (2026-09-29 新增) ======
       这里用 <symbol> 集中定义一次图形, 各处 <use href="#..."> 引用。
       为什么不直接把 SVG 内联进按钮:
         1. <defs> 里的渐变有 id。同一天可能渲染十几行作业, 每行内联一份
            就会产生重复 id, url(#id) 只认文档里第一个, 后面几朵花会串色。
         2. 按钮 HTML 会随每次重绘重新 innerHTML, 十几份重复路径纯属浪费。

       零占位必须写在元素自身上, 不能只靠 styles.css 的 .svg-defs:
       <svg> 是替换元素, 没给尺寸时默认占 300x150。一旦样式没加载 /
       被旧缓存命中 / 加载失败, 这个空白块就会把 header 整体顶下去
       (2026-09-29 实测踩过)。inline style 跟 HTML 一起下发, 不受
       CSS 缓存影响, 才是可靠的兜底。
       不用 display:none —— 部分浏览器对 display:none 的子树停止解析,
       <use> 会引用不到 <symbol>; absolute + 0x0 才是"留在文档树里"的隐藏。 -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false"
       style="position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;pointer-events:none">
    <defs>
      <!-- 小红花: 奖励贴纸, 也是"完成"按钮的新形象 (5 瓣 + 金色花心 + 绿叶) -->
      <linearGradient id="petalGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF6B7A" />
        <stop offset="55%" stop-color="#F0304A" />
        <stop offset="100%" stop-color="#C8102E" />
      </linearGradient>
      <radialGradient id="coreGrad" cx="38%" cy="34%" r="70%">
        <stop offset="0%" stop-color="#FFF3B0" />
        <stop offset="60%" stop-color="#FFC531" />
        <stop offset="100%" stop-color="#F0A31A" />
      </radialGradient>
      <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#6FCB7B" />
        <stop offset="100%" stop-color="#2E8B3C" />
      </linearGradient>

      <symbol id="i-flower" viewBox="0 0 24 24">
        <path d="M12 22.5v-4" stroke="#2E8B3C" stroke-width="1.4" stroke-linecap="round" />
        <path d="M12 19.6c-1.9-.5-3-2.2-2.7-4 .1-.4.5-.6.9-.4 1.5.7 2.3 2.2 1.8 4.4z"
              fill="url(#leafGrad)" />
        <path d="M12.1 19.9c1.9-.6 2.7-2.4 2.2-4.2-.1-.4-.5-.5-.9-.3-1.5.8-2.1 2.4-1.3 4.5z"
              fill="url(#leafGrad)" />
        <g fill="url(#petalGrad)">
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(72 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(144 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(216 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(288 12 11)" />
        </g>
        <circle cx="12" cy="11" r="3.5" fill="url(#coreGrad)" />
        <circle cx="10.8" cy="9.8" r="1.15" fill="#fff" opacity=".55" />
      </symbol>

      <!-- 已完成: 同一朵花压扁 + 灰调, 表示"这朵花已经送出" -->
      <symbol id="i-flower-done" viewBox="0 0 24 24">
        <g fill="#C9CBC6">
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(72 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(144 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(216 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(288 12 11)" />
        </g>
        <circle cx="12" cy="11" r="3.5" fill="#E8E9E5" />
        <path d="M10.6 11.2l1.1 1.2 2-2.4" fill="none" stroke="#8E918B"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>

      <!-- ====== 底部导航图标 (2026-10-12) ======
           底栏原来只有五个汉字, 小学生扫一眼认不出"复盘""看板"这类词,
           家长得逐字读。配上图后形状先于文字被识别, 切换 Tab 变成"找图"
           而不是"读字"。

           统一 24x24 / stroke 1.8 / 圆头圆角, 与正文圆角风格一致;
           描边一律 currentColor —— 选中态只改 button 的 color 就能让
           图标跟着变色, 不必为每个 Tab 各画一份彩色版。 -->
      <!-- 看板: 分栏板 + 四张任务卡 -->
      <symbol id="i-tab-board" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="3" fill="none"
              stroke="currentColor" stroke-width="1.8" />
        <path d="M9 4v16" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" />
        <rect x="4.9" y="7.4" width="2.6" height="2.6" rx="1" fill="currentColor" />
        <rect x="10.4" y="7.4" width="2.6" height="2.6" rx="1" fill="currentColor" opacity=".5" />
        <rect x="4.9" y="12.2" width="2.6" height="2.6" rx="1" fill="currentColor" opacity=".5" />
        <rect x="10.4" y="12.2" width="2.6" height="2.6" rx="1" fill="currentColor" />
      </symbol>
      <!-- 登记: 铅笔 (写下来 = 记一条) -->
      <symbol id="i-tab-entry" viewBox="0 0 24 24">
        <path d="M4 20.2h4.2L19 9.4a2.12 2.12 0 0 0-3-3L5.2 17v3.2z" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M14.6 6.6l2.9 2.9" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <!-- 日历: 挂历 + 日期点 -->
      <symbol id="i-tab-calendar" viewBox="0 0 24 24">
        <rect x="3.4" y="5" width="17.2" height="15.6" rx="3" fill="none"
              stroke="currentColor" stroke-width="1.8" />
        <path d="M3.4 9.6h17.2M8 3.2v3.6M16 3.2v3.6" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="8.4" cy="13.6" r="1.2" fill="currentColor" />
        <circle cx="12" cy="13.6" r="1.2" fill="currentColor" />
        <circle cx="15.6" cy="13.6" r="1.2" fill="currentColor" opacity=".5" />
        <circle cx="8.4" cy="17.1" r="1.2" fill="currentColor" opacity=".5" />
      </symbol>
      <!-- 复盘: 递增柱状图 (回看一段时间的量) -->
      <symbol id="i-tab-review" viewBox="0 0 24 24">
        <path d="M4 20.2h16" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" />
        <rect x="5.6" y="12.4" width="3.5" height="5.4" rx="1.4" fill="currentColor" opacity=".55" />
        <rect x="10.25" y="9" width="3.5" height="8.8" rx="1.4" fill="currentColor" opacity=".8" />
        <rect x="14.9" y="5.4" width="3.5" height="12.4" rx="1.4" fill="currentColor" />
      </symbol>
      <!-- 周计划: 七日格子 + 两天有安排的点 -->
      <symbol id="i-tab-week" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="15" rx="3" fill="none"
              stroke="currentColor" stroke-width="1.8" />
        <path d="M3 9.5h18M7.5 9.5v10.5M12 9.5v10.5M16.5 9.5v10.5" fill="none"
              stroke="currentColor" stroke-width="1.4" opacity=".7" />
        <circle cx="7.5" cy="13.2" r="1.15" fill="currentColor" />
        <circle cx="12" cy="16.4" r="1.15" fill="currentColor" opacity=".55" />
      </symbol>
      <!-- 设置: 推子 (调节 = 配置。比齿轮少一圈锯齿, 20px 下更清楚) -->
      <symbol id="i-tab-settings" viewBox="0 0 24 24">
        <path d="M3.6 8.2h9.2M18.4 8.2h2M3.6 15.8h3.2M12.4 15.8h8" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="15.4" cy="8.2" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8" />
        <circle cx="9.4" cy="15.8" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8" />
      </symbol>

      <!-- 补用时: 沙漏 (2026-10-12 密度优化新增) -->
      <symbol id="i-clock" viewBox="0 0 24 24">
        <path d="M7 3.4h10M7 20.6h10" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" />
        <path d="M8 3.4v3.1c0 1.2 3.6 3.1 4 4.6.4-1.5 4-3.4 4-4.6V3.4" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M8 20.6v-3.1c0-1.2 3.6-3.1 4-4.6.4 1.5 4 3.4 4 4.6v3.1" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      </symbol>
      <!-- 编辑: 铅笔 (与 Tab 图标 i-tab-entry 同形, 全站"改内容"统一用它) -->
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M4 20.2h4.2L19 9.4a2.12 2.12 0 0 0-3-3L5.2 17v3.2z" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M14.6 6.6l2.9 2.9" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" />
      </symbol>
    </defs>
  </svg>

  <header>
    <h1>作业小助手</h1>
    <nav id="tabs" role="tablist">
      <button data-tab="board" class="active" role="tab" aria-selected="true"><svg class="tab-ico" aria-hidden="true"><use href="#i-tab-board"></use></svg><span>看板</span></button>
      <button data-tab="entry" role="tab" aria-selected="false"><svg class="tab-ico" aria-hidden="true"><use href="#i-tab-entry"></use></svg><span>登记</span></button>
      <button data-tab="list" role="tab" aria-selected="false"><svg class="tab-ico" aria-hidden="true"><use href="#i-tab-calendar"></use></svg><span>日历</span></button>
      <button data-tab="week" role="tab" aria-selected="false"><svg class="tab-ico" aria-hidden="true"><use href="#i-tab-week"></use></svg><span>周计划</span></button>
      <button data-tab="review" role="tab" aria-selected="false"><svg class="tab-ico" aria-hidden="true"><use href="#i-tab-review"></use></svg><span>复盘</span></button>
      <button data-tab="settings" role="tab" aria-selected="false"><svg class="tab-ico" aria-hidden="true"><use href="#i-tab-settings"></use></svg><span>设置</span></button>
    </nav>
    <div id="health-bar" aria-live="polite"></div>
  </header>

  <main>
    <!-- ====== 看板 ====== -->
    <section id="view-board" class="view active" role="tabpanel">
      <div id="board-date-tabs" class="date-tabs"></div>
      <div id="board-content"></div>
    </section>

    <!-- ====== 登记 (原「解析」, 2026-09-28 改名) ======
         Tab 名对家长应描述"要做什么"而非内部机制: 家长做的是
         "把今天老师发的作业登记进来", "解析" 说的是 AI 那一侧。
         页面内的动作文案(点「解析」按钮后提示"AI 解析中")保持不变。 -->
    <section id="view-entry" class="view" role="tabpanel">
      <h2>录入作业</h2>
      <p class="muted">粘贴老师通知原文 → AI 解析 → 逐条确认 → 入库</p>
      <div class="row entry-batch">
        <label>归属日期
          <input id="entry-date" type="date" class="js-datepicker" />
        </label>
        <span class="muted">AI 识别出日期的行会自动填写, 识别不出的需你确认</span>
      </div>

      <!-- 快速添加 (M1 统一任务池): 常做的培训/习惯任务不该每次都走 AI 解析.
           模板点一下就把整套默认任务加进当天清单, 重复点击会被后端去重。 -->
      <div class="card quick-add">
        <div class="card-title">快速添加<span class="count">常做任务</span></div>
        <div class="quick-kinds" id="qa-kinds" role="group" aria-label="任务来源">
          <button type="button" class="qa-kind active" data-kind="subject">学科作业</button>
          <button type="button" class="qa-kind" data-kind="training">培训</button>
          <button type="button" class="qa-kind" data-kind="habit">习惯</button>
        </div>
        <div class="quick-row" id="qa-subject-row">
          <select id="qa-subject" aria-label="科目">
            <option>语文</option><option>数学</option><option>英语</option>
          </select>
        </div>
        <div class="quick-row" id="qa-project-row" hidden></div>
        <div class="quick-row">
          <input id="qa-name" placeholder="任务名, 如 曲目练习" aria-label="任务名" />
          <input id="qa-est" type="number" min="1" max="180" value="15" inputmode="numeric" aria-label="预计用时" />
          <button id="qa-add" class="primary" type="button">添加</button>
        </div>
        <div id="qa-templates" class="quick-templates"></div>
      </div>

      <textarea id="raw-text" rows="10" placeholder="把老师发的通知原文整段粘进来"></textarea>
      <div class="row entry-tools">
        <button id="btn-fill-sample" class="ghost" type="button">填入示例</button>
        <button id="btn-clear-raw" class="ghost" type="button">清空</button>
        <div class="char-count" id="char-count"><span id="char-count-num">0</span> / 10000</div>
      </div>
      <div class="row entry-actions">
        <button id="btn-parse" class="primary">解析</button>
        <!-- 手动添加按钮: 设计文档 §9 坑 4 — 始终可见, AI 不可用时加暗红描边 -->
        <button id="btn-add-manual" class="secondary" title="手动添加一条作业">手动添加</button>
        <span id="parse-status" class="muted"></span>
      </div>
      <div id="parse-result"></div>
    </section>

    <!-- ====== 日历 (月历 + 当日详情) ======
         id 仍是 view-list: switchTab('list') 与之绑定, 改名会牵连多处;
         用户可见的 Tab 名称已改为"日历"(2026-09-28)。 -->
    <section id="view-list" class="view" role="tabpanel">
      <h2>作业日历</h2>
      <div class="cal-head">
        <button id="cal-prev" class="ghost" aria-label="上个月">← 上月</button>
        <div id="cal-title" class="cal-title"></div>
        <button id="cal-next" class="ghost" aria-label="下个月">下月 →</button>
        <button id="cal-today" class="ghost">回到今天</button>
      </div>
      <!-- 双模式切换 (2026-10-30): 完成情况 / 用时热力图。
           两种模式共用同一份 _calData, 切模式不发请求, 只重画格子。 -->
      <div class="cal-mode" role="group" aria-label="日历查看模式">
        <button type="button" class="cal-mode-btn active" data-cal-mode="completion"
                aria-pressed="true">完成情况</button>
        <button type="button" class="cal-mode-btn" data-cal-mode="heat"
                aria-pressed="false">用时热力图</button>
      </div>
      <div class="cal-weekdays" aria-hidden="true">
        <span>一</span><span>二</span><span>三</span><span>四</span>
        <span>五</span><span class="we">六</span><span class="we">日</span>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div class="cal-legend" id="cal-legend-completion">
        <span><i class="lg lg-has"></i>有作业</span>
        <span><i class="lg lg-done"></i>全完成</span>
        <span><i class="lg lg-part"></i>部分完成</span>
        <span><i class="lg lg-opt"></i>仅选做</span>
      </div>
      <!-- 热力图图例: 分档与 app.js 的 heatLevel() 阈值 (60/100/140/180) 一一对应 -->
      <div class="cal-legend" id="cal-legend-heat" hidden>
        <span><i class="lg lg-heat0"></i>无</span>
        <span><i class="lg lg-heat1"></i>1-59分</span>
        <span><i class="lg lg-heat2"></i>60-99分</span>
        <span><i class="lg lg-heat3"></i>100-139分</span>
        <span><i class="lg lg-heat4"></i>140-179分</span>
        <span><i class="lg lg-heat5"></i>180分+</span>
      </div>

      <div class="list-detail-head">
        <h3 id="list-detail-title">选择日期查看当天作业</h3>
        <div class="row">
          <button id="btn-load-today" class="ghost">今天</button>
          <button id="btn-load-yesterday" class="ghost">昨天</button>
        </div>
      </div>
      <div id="list-content"></div>
    </section>

    <!-- ====== 周计划 (M5) ======
         一周 7 天: 固定课表 + 计划项 + 当天真实任务的负荷合成。
         这一页回答的是"这周哪天最满、有没有时间段撞车",
         而不是再列一遍作业 —— 作业在「看板」里。 -->
    <section id="view-week" class="view" role="tabpanel">
      <div id="week-content"></div>
    </section>

    <!-- ====== 复盘 ====== -->
    <section id="view-review" class="view" role="tabpanel">
      <h2>周期复盘</h2>
      <div class="row review-range">
        <button data-period="current" class="primary period-btn">本周</button>
        <button data-period="last" class="ghost period-btn">上周</button>
        <button data-period="month" class="ghost period-btn">本月</button>
        <!-- 周末显示开关 (2026-10-30): 默认不勾 = 不显示周末。
             作业都在上学最后一天 (通常周五) 布置, 周末既没作业也不存在
             "上了学却没写"的情况 —— 在图上只是一根空柱, 在分档卡里只是
             一张 0 分钟的卡, 看着像漏统计, 实际什么也没有。 -->
        <label class="weekend-toggle">
          <input type="checkbox" id="chk-weekend" />
          <span>显示周末</span>
        </label>
      </div>
      <div id="review-content"></div>
    </section>

    <!-- ====== 设置 ====== -->
    <section id="view-settings" class="view" role="tabpanel">
      <h2>设置</h2>
      <div id="settings-content"></div>
      <h3>数据导出</h3>
      <button id="btn-export" class="primary">下载全部数据 (JSON)</button>
    </section>
  </main>

  <!-- ====== 通用 modal (手动添加 / 预览编辑) ====== -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-body">
      <h3 id="modal-title"></h3>
      <div id="modal-content"></div>
      <div class="row modal-actions">
        <button id="modal-cancel" class="secondary">取消</button>
        <button id="modal-ok" class="primary">确定</button>
      </div>
    </div>
  </div>

  <!-- ====== Toast (设计文档 §9 坑 2 兜底) ====== -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <footer>
    <small id="api-info">作业数据保存在本机, 不上传到任何服务器</small>
  </footer>

  <script src="/static/vendor/flatpickr.min.js"></script>
  <script src="/static/vendor/flatpickr.zh.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
