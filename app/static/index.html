<!doctype html>
<html lang="zh-CN" data-role="parent" data-eyecare="off">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F6F8" />
  <title>作业小助手 · 小学生作业跟踪</title>
  <!-- 角色字体 (规范 §3): 孩子端楷体, 家长端宋体, 正文一律系统黑体。
       刻意**不引 Google Fonts CDN** —— 本项目是本地部署, 要求离线可用
       (tests/test_datepicker.py::test_no_cdn_dependency 钉着这条),
       而且孩子端楷体/家长端宋体这两个字 Windows(KaiTi/SimSun) 与
       macOS(Kaiti SC/Songti SC) 都自带, 不必联网拉 20MB 的中文字库。
       完整字体栈见 styles.css 的 --font-display。 -->
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/vendor/flatpickr.min.css" />
  <link rel="stylesheet" href="/static/vendor/flatpickr-theme.css" />
  <!-- 首帧防闪 (2026-11-01 双角色改造): 角色与护眼模式必须在第一帧
       就落到 <html> 上, 否则会先画一帧家长皮肤再切成孩子皮肤 —— 孩子
       一眼就看出"闪了一下"。这段脚本必须留在 <head> 里且同步执行:
       它比 app.js 先跑, 而 app.js 要等 DOM 解析完才加载。
       隐私模式下 localStorage 会抛异常, 整段兜住, 失败就用默认值。 -->
  <script>
    (function () {
      var d = document.documentElement;
      d.dataset.role = 'parent';
      d.dataset.eyecare = 'off';
      try {
        var r = localStorage.getItem('st.role');
        if (r === 'kid' || r === 'parent') d.dataset.role = r;
        if (localStorage.getItem('st.eyecare') === 'on') d.dataset.eyecare = 'on';
      } catch (e) { /* 存不了就只用默认值, 不该因此挡住页面 */ }
    })();
  </script>
</head>
<body>
  <!-- ====== SVG 图形库 (2026-09-29 新增) ======
       这里用 <symbol> 集中定义一次图形, 各处 <use href="#..."> 引用。
       为什么不直接把 SVG 内联进按钮:
         1. <defs> 里的渐变有 id。同一天可能渲染十几行作业, 每行内联一份
            就会产生重复 id, url(#id) 只认文档里第一个, 后面几朵花会串色。
         2. 按钮 HTML 会随每次重绘重新 innerHTML, 十几份重复路径纯属浪费。

       零占位必须写在元素自身上, 不能只靠 styles.css 的 .svg-defs:
       <svg> 是替换元素, 没给尺寸时默认占 300x150。一旦样式没加载 /
       被旧缓存命中 / 加载失败, 这个空白块就会把 header 整体顶下去
       (2026-09-29 实测踩过)。inline style 跟 HTML 一起下发, 不受
       CSS 缓存影响, 才是可靠的兜底。
       不用 display:none —— 部分浏览器对 display:none 的子树停止解析,
       <use> 会引用不到 <symbol>; absolute + 0x0 才是"留在文档树里"的隐藏。 -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false"
       style="position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;pointer-events:none">
    <defs>
      <!-- 小红花: 奖励贴纸, 也是"完成"按钮的新形象 (5 瓣 + 金色花心 + 绿叶) -->
      <linearGradient id="petalGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF6B7A" />
        <stop offset="55%" stop-color="#F0304A" />
        <stop offset="100%" stop-color="#C8102E" />
      </linearGradient>
      <radialGradient id="coreGrad" cx="38%" cy="34%" r="70%">
        <stop offset="0%" stop-color="#FFF3B0" />
        <stop offset="60%" stop-color="#FFC531" />
        <stop offset="100%" stop-color="#F0A31A" />
      </radialGradient>
      <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#6FCB7B" />
        <stop offset="100%" stop-color="#2E8B3C" />
      </linearGradient>

      <symbol id="i-flower" viewBox="0 0 24 24">
        <path d="M12 22.5v-4" stroke="#2E8B3C" stroke-width="1.4" stroke-linecap="round" />
        <path d="M12 19.6c-1.9-.5-3-2.2-2.7-4 .1-.4.5-.6.9-.4 1.5.7 2.3 2.2 1.8 4.4z"
              fill="url(#leafGrad)" />
        <path d="M12.1 19.9c1.9-.6 2.7-2.4 2.2-4.2-.1-.4-.5-.5-.9-.3-1.5.8-2.1 2.4-1.3 4.5z"
              fill="url(#leafGrad)" />
        <g fill="url(#petalGrad)">
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(72 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(144 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(216 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(288 12 11)" />
        </g>
        <circle cx="12" cy="11" r="3.5" fill="url(#coreGrad)" />
        <circle cx="10.8" cy="9.8" r="1.15" fill="#fff" opacity=".55" />
      </symbol>

      <!-- 已完成: 同一朵花压扁 + 灰调, 表示"这朵花已经送出" -->
      <symbol id="i-flower-done" viewBox="0 0 24 24">
        <g fill="#C9CBC6">
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(72 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(144 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(216 12 11)" />
          <ellipse cx="12" cy="6.4" rx="3.15" ry="4.3" transform="rotate(288 12 11)" />
        </g>
        <circle cx="12" cy="11" r="3.5" fill="#E8E9E5" />
        <path d="M10.6 11.2l1.1 1.2 2-2.4" fill="none" stroke="#8E918B"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>

      <!-- ====== 底部导航图标 (2026-10-12) ======
           底栏原来只有五个汉字, 小学生扫一眼认不出"复盘""看板"这类词,
           家长得逐字读。配上图后形状先于文字被识别, 切换 Tab 变成"找图"
           而不是"读字"。

           统一 24x24 / stroke 1.8 / 圆头圆角, 与正文圆角风格一致;
           描边一律 currentColor —— 选中态只改 button 的 color 就能让
           图标跟着变色, 不必为每个 Tab 各画一份彩色版。 -->
      <!-- 今日: 太阳 (2026-11-01 双角色改造)
           原来的 i-tab-board (分栏板) 是"看板"这一页的图形, 导航精简成
           3 个 Tab 后那一页改叫「今日」, 图标也换成太阳 —— 一眼就知道
           "这是今天要干的活"。描边一律 currentColor, 选中态只改 button
           的 color, 图标自动跟着变色。 -->
      <symbol id="i-tab-today" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <!-- 日历: 挂历 + 日期点 -->
      <symbol id="i-tab-calendar" viewBox="0 0 24 24">
        <rect x="3.4" y="5" width="17.2" height="15.6" rx="3" fill="none"
              stroke="currentColor" stroke-width="1.8" />
        <path d="M3.4 9.6h17.2M8 3.2v3.6M16 3.2v3.6" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="8.4" cy="13.6" r="1.2" fill="currentColor" />
        <circle cx="12" cy="13.6" r="1.2" fill="currentColor" />
        <circle cx="15.6" cy="13.6" r="1.2" fill="currentColor" opacity=".5" />
        <circle cx="8.4" cy="17.1" r="1.2" fill="currentColor" opacity=".5" />
      </symbol>
      <!-- 复盘: 递增柱状图 (回看一段时间的量) -->
      <symbol id="i-tab-review" viewBox="0 0 24 24">
        <path d="M4 20.2h16" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" />
        <rect x="5.6" y="12.4" width="3.5" height="5.4" rx="1.4" fill="currentColor" opacity=".55" />
        <rect x="10.25" y="9" width="3.5" height="8.8" rx="1.4" fill="currentColor" opacity=".8" />
        <rect x="14.9" y="5.4" width="3.5" height="12.4" rx="1.4" fill="currentColor" />
      </symbol>

      <!-- 补用时: 沙漏 (2026-10-12 密度优化新增) -->
      <symbol id="i-clock" viewBox="0 0 24 24">
        <path d="M7 3.4h10M7 20.6h10" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" />
        <path d="M8 3.4v3.1c0 1.2 3.6 3.1 4 4.6.4-1.5 4-3.4 4-4.6V3.4" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M8 20.6v-3.1c0-1.2 3.6-3.1 4-4.6.4 1.5 4 3.4 4 4.6v3.1" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      </symbol>
      <!-- 编辑: 铅笔 (全站"改内容"统一用它) -->
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M4 20.2h4.2L19 9.4a2.12 2.12 0 0 0-3-3L5.2 17v3.2z" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M14.6 6.6l2.9 2.9" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <!-- 加号: 「登记作业」核心入口 (2026-11-02) -->
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5.2v13.6M5.2 12h13.6" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" />
      </symbol>

      <!-- ====== 孩子端图形 (2026-11-01 双角色改造) ======
           贴纸与勋章都用矢量而不是 emoji: emoji 在不同系统里长相不一,
           颜色也压不住 (同一个 ⭐ 在安卓和 iOS 上根本不是一个样子)。
           统一 currentColor, 底色交给 CSS 的学科色变量。 -->
      <!-- 贴纸: 五角星 (贴纸册日历) -->
      <symbol id="i-kid-sticker" viewBox="0 0 24 24">
        <path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z"
              fill="currentColor" />
      </symbol>
      <!-- 勋章: 圆章 + 绶带 (成绩单) -->
      <symbol id="i-kid-medal" viewBox="0 0 24 24">
        <path d="M8 2.6h8l-2.2 5.1H10.2z" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linejoin="round" />
        <circle cx="12" cy="15" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M9.6 15.1l1.7 1.7 3.2-3.4" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <!-- 更多: 三点 (孩子端任务卡的 ⋯ 菜单) -->
      <symbol id="i-kid-more" viewBox="0 0 24 24">
        <circle cx="5.5" cy="12" r="1.7" fill="currentColor" />
        <circle cx="12" cy="12" r="1.7" fill="currentColor" />
        <circle cx="18.5" cy="12" r="1.7" fill="currentColor" />
      </symbol>
    </defs>
  </svg>

  <header>
    <h1>作业小助手</h1>
    <!-- 导航精简为 3 个 Tab (2026-11-01 双角色改造):
         家长端 今日 / 日历 / 复盘, 孩子端 今日 / 日历 / 成绩单。
         同一个 Tab 键在两个角色下指向不同的页面, 标签由 app.js 按
         document.documentElement.dataset.role 改写 (见 TAB_LABELS)。

         下面三个 .tab-utility 按钮是**深链落点**, 不是 Tab:
         登记 / 周计划 / 设置属于家长端, 它们的入口在页面里 (今日页右上
         「＋ 登记作业」、日历页右上「周计划」、右上角头像菜单里的「设置」),
         不占 Tab 栏的位置。保留这三个按钮只是为了让 #/entry、#/week、
         #/settings 三个深链仍能落到对应的 view 上 (直接输地址栏打开
         也能用)。display:none 写在内联样式里而不是用 hidden 属性:
         nav#tabs button 的 display:flex 权重高于 UA 的 [hidden] 规则,
         只写 hidden 会被它盖掉, 按钮照样显示出来。 -->
    <nav id="tabs" role="tablist">
      <button data-tab="board" class="active" role="tab" aria-selected="true"><svg class="tab-ico" aria-hidden="true"><use href="#i-tab-today"></use></svg><span>今日</span></button>
      <button data-tab="list" role="tab" aria-selected="false"><svg class="tab-ico" aria-hidden="true"><use href="#i-tab-calendar"></use></svg><span>日历</span></button>
      <button data-tab="review" role="tab" aria-selected="false"><svg class="tab-ico" aria-hidden="true"><use href="#i-tab-review"></use></svg><span>复盘</span></button>
      <button data-tab="entry" class="tab-utility" role="tab" aria-selected="false" style="display:none">登记</button>
      <button data-tab="week" class="tab-utility" role="tab" aria-selected="false" style="display:none">周计划</button>
      <button data-tab="settings" class="tab-utility" role="tab" aria-selected="false" style="display:none">设置</button>
    </nav>
    <div id="health-bar" aria-live="polite"></div>
    <!-- 角色切换 + 头像菜单 (2026-11-01 双角色改造) -->
    <div class="header-tools">
      <button type="button" class="role-switch" id="role-switch" aria-label="切换到孩子端">切到孩子</button>
      <div class="role-menu-wrap" id="role-menu-wrap">
        <button type="button" class="role-menu-btn" id="role-menu-btn"
                aria-haspopup="true" aria-expanded="false" aria-label="更多">头像</button>
        <div class="role-menu" id="role-menu" role="menu" hidden>
          <button type="button" class="role-menu__item" role="menuitem" data-role-action="settings">设置</button>
          <button type="button" class="role-menu__item" role="menuitem" data-role-action="export">数据导出</button>
          <button type="button" class="role-menu__item" role="menuitem" data-role-action="privacy">隐私说明</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- ====== 今日 (原「看板」, 2026-11-01 改名) ======
         家长端 = 批改台, 孩子端 = 星星罐 + 大任务卡, 同一份数据两种读法。
         「＋ 登记作业」是家长端专属入口 (孩子端看不到)。 -->
    <section id="view-board" class="view active" role="tabpanel">
      <div class="view-head">
        <h2 class="view-title" id="board-title">今日</h2>
        <div class="view-actions">
          <button type="button" class="cta-entry view-parent-only" id="btn-entry-today">
            <svg class="cta-entry__ico" aria-hidden="true"><use href="#i-plus"></use></svg>
            <span>登记作业</span>
          </button>
        </div>
      </div>
      <div id="board-date-tabs" class="date-tabs"></div>
      <div id="board-content"></div>
    </section>

    <!-- ====== 登记 (原「解析」, 2026-09-28 改名) ======
         Tab 名对家长应描述"要做什么"而非内部机制: 家长做的是
         "把今天老师发的作业登记进来", "解析" 说的是 AI 那一侧。
         页面内的动作文案(点「解析」按钮后提示"AI 解析中")保持不变。 -->
    <section id="view-entry" class="view" role="tabpanel">
      <h2>录入作业</h2>
      <p class="muted">粘贴老师通知原文 → AI 解析 → 逐条确认 → 入库</p>
      <div class="row entry-batch">
        <label>归属日期
          <input id="entry-date" type="date" class="js-datepicker" />
        </label>
        <span class="muted">AI 识别出日期的行会自动填写, 识别不出的需你确认</span>
      </div>

      <!-- 快速添加 (M1 统一任务池): 常做的培训/习惯任务不该每次都走 AI 解析.
           模板点一下就把整套默认任务加进当天清单, 重复点击会被后端去重。 -->
      <div class="card quick-add">
        <div class="card-title">快速添加<span class="count">常做任务</span></div>
        <div class="quick-kinds" id="qa-kinds" role="group" aria-label="任务来源">
          <button type="button" class="qa-kind active" data-kind="subject">学科作业</button>
          <button type="button" class="qa-kind" data-kind="training">培训</button>
          <button type="button" class="qa-kind" data-kind="habit">习惯</button>
        </div>
        <div class="quick-row" id="qa-subject-row">
          <select id="qa-subject" aria-label="科目">
            <option>语文</option><option>数学</option><option>英语</option>
          </select>
        </div>
        <div class="quick-row" id="qa-project-row" hidden></div>
        <div class="quick-row">
          <input id="qa-name" placeholder="任务名, 如 曲目练习" aria-label="任务名" />
          <input id="qa-est" type="number" min="1" max="180" value="15" inputmode="numeric" aria-label="预计用时" />
          <button id="qa-add" class="primary" type="button">添加</button>
        </div>
        <div id="qa-templates" class="quick-templates"></div>
      </div>

      <textarea id="raw-text" rows="10" placeholder="把老师发的通知原文整段粘进来"></textarea>
      <div class="row entry-tools">
        <button id="btn-fill-sample" class="ghost" type="button">填入示例</button>
        <button id="btn-clear-raw" class="ghost" type="button">清空</button>
        <div class="char-count" id="char-count"><span id="char-count-num">0</span> / 10000</div>
      </div>
      <div class="row entry-actions">
        <button id="btn-parse" class="primary">解析</button>
        <!-- 手动添加按钮: 设计文档 §9 坑 4 — 始终可见, AI 不可用时加暗红描边 -->
        <button id="btn-add-manual" class="secondary" title="手动添加一条作业">手动添加</button>
        <span id="parse-status" class="muted"></span>
      </div>
      <div id="parse-result"></div>
    </section>

    <!-- ====== 日历 (月历 + 当日详情) ======
         id 仍是 view-list: switchTab('list') 与之绑定, 改名会牵连多处;
         用户可见的 Tab 名称已改为"日历"(2026-09-28)。 -->
    <section id="view-list" class="view" role="tabpanel">
      <div class="view-head">
        <h2 class="view-title">作业日历</h2>
        <div class="view-actions">
          <!-- 视图切换器 (2026-11-02): 日历页与周计划页是「同一个地方
               的两种看法」, 所以用分段控件, 不是孤零零一个按钮。
               id=btn-week-plan 不能改 —— test_header_ui 钉着。 -->
          <div class="view-switch view-parent-only" id="btn-week-plan" role="group" aria-label="视图切换">
            <button type="button" class="view-switch__btn is-active" data-view="calendar" aria-pressed="true">月历</button>
            <button type="button" class="view-switch__btn" data-view="week" aria-pressed="false">周计划</button>
          </div>
        </div>
      </div>
      <div class="cal-head">
        <button id="cal-prev" class="ghost" aria-label="上个月">← 上月</button>
        <div id="cal-title" class="cal-title"></div>
        <button id="cal-next" class="ghost" aria-label="下个月">下月 →</button>
        <button id="cal-today" class="ghost">回到今天</button>
      </div>
      <!-- 双模式切换 (2026-10-30): 完成情况 / 用时热力图。
           两种模式共用同一份 _calData, 切模式不发请求, 只重画格子。
           第三个模式「贴纸册」是孩子端专属 (2026-11-01): 它是**新增**的,
           不替换上面两个 —— 家长端仍然只有完成情况 / 用时热力图。 -->
      <div class="cal-mode" role="group" aria-label="日历查看模式">
        <button type="button" class="cal-mode-btn active" data-cal-mode="completion"
                aria-pressed="true">完成情况</button>
        <button type="button" class="cal-mode-btn" data-cal-mode="heat"
                aria-pressed="false">用时热力图</button>
        <button type="button" class="cal-mode-btn cal-mode-kid" data-cal-mode="sticker"
                aria-pressed="false">贴纸册</button>
      </div>
      <div class="cal-weekdays" aria-hidden="true">
        <span>一</span><span>二</span><span>三</span><span>四</span>
        <span>五</span><span class="we">六</span><span class="we">日</span>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div class="cal-legend" id="cal-legend-completion">
        <span><i class="lg lg-has"></i>有作业</span>
        <span><i class="lg lg-done"></i>全完成</span>
        <span><i class="lg lg-part"></i>部分完成</span>
        <span><i class="lg lg-opt"></i>仅选做</span>
      </div>
      <!-- 热力图图例: 分档与 app.js 的 heatLevel() 阈值 (60/100/140/180) 一一对应 -->
      <div class="cal-legend" id="cal-legend-heat" hidden>
        <span><i class="lg lg-heat0"></i>无</span>
        <span><i class="lg lg-heat1"></i>1-59分</span>
        <span><i class="lg lg-heat2"></i>60-99分</span>
        <span><i class="lg lg-heat3"></i>100-139分</span>
        <span><i class="lg lg-heat4"></i>140-179分</span>
        <span><i class="lg lg-heat5"></i>180分+</span>
      </div>
      <!-- 贴纸册图例 (孩子端): 贴纸形状本身在格子里, 这里只解释三种状态 -->
      <div class="cal-legend" id="cal-legend-sticker" hidden>
        <span>全部完成</span>
        <span>完成了一部分</span>
        <span>还没开始</span>
      </div>

      <div class="list-detail-head">
        <h3 id="list-detail-title">选择日期查看当天作业</h3>
        <div class="row">
          <button id="btn-load-today" class="ghost">今天</button>
          <button id="btn-load-yesterday" class="ghost">昨天</button>
        </div>
      </div>
      <div id="list-content"></div>
    </section>

    <!-- ====== 周计划 (M5) ======
         一周 7 天: 固定课表 + 计划项 + 当天真实任务的负荷合成。
         这一页回答的是"这周哪天最满、有没有时间段撞车",
         而不是再列一遍作业 —— 作业在「看板」里。 -->
    <section id="view-week" class="view" role="tabpanel">
      <!-- 标题行 (2026-11-02): 之前这页直接是内容, 深链进来不知道
           在哪。现在有标题 + 同一个视图切换器, 能直接切回日历。 -->
      <div class="view-head">
        <h2 class="view-title">周计划</h2>
        <div class="view-actions">
          <div class="view-switch view-parent-only" id="btn-calendar-view" role="group" aria-label="视图切换">
            <button type="button" class="view-switch__btn" data-view="calendar" aria-pressed="false">月历</button>
            <button type="button" class="view-switch__btn is-active" data-view="week" aria-pressed="true">周计划</button>
          </div>
        </div>
      </div>
      <div id="week-content"></div>
    </section>

    <!-- ====== 复盘 ======
         家长端 = 周期复盘 (环形图 / 折线 / 薄弱项), 孩子端 = 我的成绩单
         (勋章墙 + 成长报告)。标题由 app.js 按角色改写。 -->
    <section id="view-review" class="view" role="tabpanel">
      <h2 id="review-title">周期复盘</h2>
      <div class="row review-range">
        <button data-period="current" class="primary period-btn">本周</button>
        <button data-period="last" class="ghost period-btn">上周</button>
        <button data-period="month" class="ghost period-btn">本月</button>
        <!-- 「上月」(2026-11-03): 过去整月的完整复盘, 内容与「本月」同构。
             它是家长最常问的那个问题 ("上个月过得怎么样"), 而「本月」是
             month-to-date 的 —— 月才过了三天, 柱状图上只有三根柱子。 -->
        <button data-period="last_month" class="ghost period-btn">上月</button>
        <!-- 周末显示开关 (2026-10-30): 默认不勾 = 不显示周末。
             作业都在上学最后一天 (通常周五) 布置, 周末既没作业也不存在
             "上了学却没写"的情况 —— 在图上只是一根空柱, 在分档卡里只是
             一张 0 分钟的卡, 看着像漏统计, 实际什么也没有。 -->
        <label class="weekend-toggle">
          <input type="checkbox" id="chk-weekend" />
          <span>显示周末</span>
        </label>
      </div>
      <!-- 月份步进器 (2026-11-03): 只在「上月」周期出现。
           「上月」里能往前翻历史月份 —— 复盘的不该只有最近一个月。
           最远只到"上个月": 本月有独立的 tab 且是 month-to-date 口径,
           同一个月份出两套口径会让家长对不上账。 -->
      <div class="row review-month-nav" id="review-month-nav" hidden>
        <button type="button" class="ghost review-month-step" id="review-month-prev"
                aria-label="上一个月">‹</button>
        <span class="review-month-label" id="review-month-label" aria-live="polite"></span>
        <button type="button" class="ghost review-month-step" id="review-month-next"
                aria-label="下一个月">›</button>
        <button type="button" class="ghost review-month-back" id="review-month-back">回到上月</button>
      </div>
      <!-- 加载遮罩 (2026-11-03)。
           切周期 (本周/上周/本月/上月) 时旧实现是"清空 -> 等请求 -> 内容
           一次性冒出来", 中间是块空白, 数据又"崩出来", 看着毛躁。
           遮罩是 #review-content 的**兄弟**节点 —— 容器被 innerHTML=''
           清空时它不受影响, 也就不会被 appendChild 顶不掉、永久残留。
           撤遮罩由 app.js 显式做 (走 finally, 渲染出错也撤)。 -->
      <div class="review-body">
        <div id="review-content"></div>
        <div class="review-loading" id="review-loading" hidden role="status" aria-live="polite">
          <span class="spinner review-loading__spin" aria-hidden="true"></span>
          <span class="review-loading__text">加载中…</span>
        </div>
      </div>
    </section>

    <!-- ====== 设置 ====== -->
    <section id="view-settings" class="view" role="tabpanel">
      <h2>设置</h2>
      <div id="settings-content"></div>
      <!-- 护眼模式 (规范 §2.4): 开关放设置页, 状态存 localStorage["st.eyecare"],
           切换时改 <html data-eyecare>。CSS 已写好对应规则, 前端只管设属性。
           这里刻意不用 .setting-card —— 那个类只给"设置项"用, 数量被
           tests/test_settings_ui.py 钉着 (必须是后端返回的那几项)。 -->
      <div class="card setting-panel eyecare-card">
        <label class="setting-label" for="chk-eyecare">
          <span class="setting-name">护眼模式</span>
          <span class="muted">屏幕调成暖色, 晚上写作业不刺眼 (只对孩子端生效)</span>
        </label>
        <label class="eyecare-switch">
          <input type="checkbox" id="chk-eyecare" />
          <span>开启</span>
        </label>
      </div>
      <h3>数据导出</h3>
      <button id="btn-export" class="primary">下载全部数据 (JSON)</button>
      <!-- 隐私说明从页脚搬到这里 (规范 §8): 首页不再常驻这行字。
           #api-info 这个 id 保留下来, 别的脚本/样式可能还指着它。 -->
      <div class="card setting-panel privacy-card" id="privacy-card">
        <div class="card-title">数据与隐私</div>
        <p class="muted" id="api-info">作业数据保存在本机, 不上传到任何服务器</p>
      </div>
    </section>
  </main>

  <!-- ====== 通用 modal (手动添加 / 预览编辑) ====== -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-body">
      <h3 id="modal-title"></h3>
      <div id="modal-content"></div>
      <div class="row modal-actions">
        <button id="modal-cancel" class="secondary">取消</button>
        <button id="modal-ok" class="primary">确定</button>
      </div>
    </div>
  </div>

  <!-- ====== Toast (设计文档 §9 坑 2 兜底) ====== -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- 页脚元素本身保留: 移动端 CSS 依赖 footer { padding-bottom: env(safe-area-inset-bottom) }
       给手势条留出空间 (见 tests/test_mobile_layout.py)。
       原来常驻在这儿的「作业数据保存在本机…」已经搬进设置页的
       「数据与隐私」区块 (规范 §8) —— 首页不再常驻隐私声明。 -->
  <footer></footer>

  <script src="/static/vendor/flatpickr.min.js"></script>
  <script src="/static/vendor/flatpickr.zh.js"></script>
  <!-- ECharts 5.5.1 本地 vendor (Apache-2.0, 见 vendor/README.md)。
       不引 CDN: 项目有「离线可用」的硬红线 (docs/08 §2.5), 且
       test_datepicker.py::test_no_cdn_dependency 钉死了这一点。 -->
  <script src="/static/vendor/echarts.min.js"></script>
  <!-- charts.js 必须排在 dual.js / app.js **之前** (2026-11-02):
       app.js 的启动块在解析时就会调 switchTab() -> loadReview(), 而
       loadReview() 会立刻建图, 那时 charts.js 与 ECharts 都得已经在场。
       charts.js 顶层只有函数/常量声明, 不在解析期碰 app.js 的全局量
       (subjectColor / orderedSubjects / sharePercents 都在**函数体内**
       引用, 调用期才解析), 把它提前是安全的。 -->
  <script src="/static/charts.js"></script>
  <!-- dual.js 必须排在 app.js **之前** (2026-11-01 修的一个顺序竞态):
       app.js 的启动块在解析时就会调 switchTab() -> loadReview(), 而
       loadReview() 靠 `typeof renderKidReport === 'function'` 判断
       "孩子端渲染器在不在"。dual.js 若排在后面, 那一刻它还没被下载执行,
       loadReview 会误走家长分支 —— 孩子端成绩单页下会整段渲染出
       家长的周报、偏差表和折线图 (实测复现)。
       dual.js 的顶层只有函数/常量声明, 不在解析期碰 app.js 的全局量,
       把它提前是安全的。app.js 侧另有 'dual-ready' 事件兜底, 万一将来
       顺序又被改回去, 会自动重画当前页。 -->
  <script src="/static/dual.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
